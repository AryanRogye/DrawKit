name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: SwiftPM Tests (macOS, ${{ matrix.configuration }})
    runs-on: xcode-27
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show tools
        run: |
          xcodebuild -version
          swift --version

      - name: Compute Swift cache key
        id: swift
        shell: bash
        run: |
          set -euo pipefail
          version=$(swift --version | head -n 1 | sed -E 's/.*version ([0-9.]+).*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-${{ steps.swift.outputs.version }}-${{ matrix.configuration }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-${{ steps.swift.outputs.version }}-${{ matrix.configuration }}-
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-${{ steps.swift.outputs.version }}-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (${{ matrix.configuration }})
        run: >-
          swift build
          --configuration ${{ matrix.configuration }}
          -Xswiftc -strict-concurrency=complete

      - name: Test (${{ matrix.configuration }})
        run: >-
          swift test
          --configuration ${{ matrix.configuration }}
          --parallel
          -Xswiftc -strict-concurrency=complete
